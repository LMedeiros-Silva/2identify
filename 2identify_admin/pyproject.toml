[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "2identify-admin"
version = "0.4.0"
description = "Cliente desktop administrativo do 2Identify"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.9.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.0.43",
    "psycopg2-binary==2.9.10",
    "alembic==1.16.4",
    "python-dotenv==1.1.1",
    "bcrypt==4.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.3"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "alembic",
    "app/models",
    "app/services/auth_service.py",
    "app/services/dashboard_service.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
exclude = '''(?x)(
    ^alembic/
    | ^app/models/
    | ^app/services/(auth_service|dashboard_service)\.py$
    | ^app/core/(database|security)\.py$
    | ^seed\.py$
    | ^tests/
)'''
